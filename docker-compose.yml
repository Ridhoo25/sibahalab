name: sibahalab

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-root_bahalab_2025}
      MYSQL_DATABASE: ${DB_NAME:-bahalab}
      TZ: Asia/Jakarta
    volumes:
      - dbdata:/var/lib/mysql
      - ./bahalab.sql:/docker-entrypoint-initdb.d/001-bahalab.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASS:-root_bahalab_2025}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: ${DB_PASS:-root_bahalab_2025}
      DB_NAME: ${DB_NAME:-bahalab}
      TZ: Asia/Jakarta
    depends_on:
      db:
        condition: service_healthy

  # Adminer hanya aktif di environment development (tidak ikut deploy ke Dokploy).
  # Jalankan di lokal dengan: docker compose --profile dev up -d
  adminer:
    image: adminer:latest
    profiles:
      - dev
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      TZ: Asia/Jakarta
    depends_on:
      - db

volumes:
  dbdata:
